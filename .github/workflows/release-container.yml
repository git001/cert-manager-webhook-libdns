name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------- Quality Gate --------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          make test

      # -------- Docker Setup --------
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------- Metadata --------
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          PUBLISH_LATEST: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ env.PUBLISH_LATEST }}

      # -------- Build + SBOM + Push --------
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # -------- Helm Chart --------
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update chart version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" deploy/libdns-webhook/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" deploy/libdns-webhook/Chart.yaml

      - name: Package Helm chart
        run: |
          mkdir -p .helm-packages
          helm package deploy/libdns-webhook --destination .helm-packages

      - name: Publish chart to gh-pages
        run: |
          PAGES_URL="https://git001.github.io/cert-manager-webhook-libdns"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clone or init gh-pages branch
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            /tmp/gh-pages 2>/dev/null || \
            (mkdir -p /tmp/gh-pages && cd /tmp/gh-pages && \
             git init && \
             git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" && \
             git checkout --orphan gh-pages)

          cp .helm-packages/*.tgz /tmp/gh-pages/

          if [ -f /tmp/gh-pages/index.yaml ]; then
            helm repo index /tmp/gh-pages --merge /tmp/gh-pages/index.yaml --url "${PAGES_URL}"
          else
            helm repo index /tmp/gh-pages --url "${PAGES_URL}"
          fi

          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${{ github.ref_name }}"
          git push origin gh-pages

      # -------- Release erstellen --------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .helm-packages/*.tgz
